<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shilra | Contato</title>
  <link rel="icon" type="image/png" href="logo1.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="logo1.png" alt="Logo Shilra">
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="servicos.html">Serviços</a></li>
        <li><a href="cases.html">Cases</a></li>
        <li><a href="contato.html" class="active">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Fale Conosco</h2>
      <p style="color: var(--color-text-muted);">Solicite uma análise preliminar das falhas e vulnerabilidades do seu negócio.</p>
      
      <form style="margin-top: 1.5rem;">
        <div class="form-group">
          <label for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail Corporativo</label>
          <input type="email" id="email" name="email" placeholder="seuemail@empresa.com" required>
        </div>
        <div class="form-group">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" rows="5" placeholder="Descreva brevemente suas necessidades de suporte ou segurança..." required></textarea>
        </div>
        <button type="submit" class="btn">Enviar Mensagem</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Shilra Tecnologias. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
